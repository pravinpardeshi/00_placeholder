<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentCore Chat</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">AC</span>
          <span class="brand-name">AgentCore Chat</span>
        </div>
        <button class="icon-button sidebar-close" id="sidebarClose" aria-label="Close sidebar">×</button>
      </div>

      <button class="new-chat" id="newChat">
        <span class="plus">+</span> New chat
      </button>

      <div class="sessions" id="sessions">
        <p class="sessions-empty">No conversations yet.</p>
      </div>

      <div class="sidebar-footer">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking memory…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Open sidebar">☰</button>
        <div>
          <h1 class="topbar-title" id="topbarTitle">New chat</h1>
          <p class="topbar-subtitle" id="topbarSubtitle">Stored in Amazon Bedrock AgentCore Memory</p>
        </div>
      </header>

      <div class="banner hidden" id="banner"></div>

      <section class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-mark">AC</div>
          <h2>How can I help you today?</h2>
          <p>Every message is saved to your AgentCore Memory session, so you can pick up any conversation later.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Summarize what Amazon Bedrock AgentCore Memory is in three sentences.">What is AgentCore Memory?</button>
            <button class="suggestion" data-prompt="Write a short Python function that reverses a linked list.">Write some Python</button>
            <button class="suggestion" data-prompt="Give me three ideas for a weekend project in Seattle.">Weekend ideas</button>
          </div>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="Message AgentCore Chat…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z" />
            </svg>
          </button>
        </div>
        <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
      </form>
    </main>
  </div>

  <div class="backdrop hidden" id="backdrop"></div>
  <script src="/static/app.js"></script>
</body>
</html>
